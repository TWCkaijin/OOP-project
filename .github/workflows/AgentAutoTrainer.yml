name: Agent Auto Trainer

on:
  push:
    branches: [gitActions]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Evaluate Mountain Car
        id: mountain_car
        run: |
          echo "Running Mountain Car Evaluation..."
          # Running evaluation with 100 episodes
          uv run python src/part1/mountain_car.py --episodes 100 > mountain_car_log.txt

          # Capture output
          cat mountain_car_log.txt

          # Extract metadata
          MC_REWARD=$(grep "Final Mean Reward" mountain_car_log.txt | tail -n 1) || echo "MC_REWARD=Not Found"
          echo "MC_REWARD=${MC_REWARD}" >> $GITHUB_ENV

      - name: Evaluate Frozen Lake
        id: frozen_lake
        run: |
          echo "Running Frozen Lake Evaluation..."
          # Running evaluation with 100 episodes
          uv run python src/part2/frozen_lake.py --episodes 100 > frozen_lake_log.txt

          # Capture output
          cat frozen_lake_log.txt

          # Extract metadata
          FL_RATE=$(grep "✅ Success Rate:" frozen_lake_log.txt | tail -n 1) || echo "FL_RATE=Not Found"
          echo "FL_RATE=${FL_RATE}" >> $GITHUB_ENV

      - name: Evaluate Warehouse Robot
        id: warehouse_robot
        run: |
          echo "Running Warehouse Robot Evaluation..."
          # Running evaluation with 100 episodes
          uv run python src/part3/warehouse_agent.py --episodes 100 > warehouse_log.txt

          # Capture output
          cat warehouse_log.txt

          # Extract metadata
          WR_RATE=$(grep "Evaluation completed. Success Rate:" warehouse_log.txt | tail -n 1) || echo "WR_RATE=Not Found"
          echo "WR_RATE=${WR_RATE}" >> $GITHUB_ENV

      - name: Prepare Report
        run: |
          echo "# 🤖 Agent Evaluation Report" > report.md
          echo "Automated evaluation run results." >> report.md
          echo "" >> report.md

          echo "## 🏔️ Mountain Car Status" >> report.md
          echo "- **Result**: ${{ env.MC_REWARD }}" >> report.md
          echo "![Mountain Car Evaluation](mountain_car.png)" >> report.md
          echo "" >> report.md

          echo "## ❄️ Frozen Lake Status" >> report.md
          echo "- **Result**: ${{ env.FL_RATE }}" >> report.md
          # Frozen Lake Evaluation does not generate a plot
          echo "" >> report.md

          echo "## 🤖 Warehouse Robot Status" >> report.md
          echo "- **Result**: ${{ env.WR_RATE }}" >> report.md
          # Warehouse Robot Evaluation does not generate a plot

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Update evaluation results [skip ci]"
          title: "🤖 Agent Evaluation Results"
          body-path: report.md
          branch: agent-evaluation-results
          base: main
          delete-branch: false
          add-paths: |
            mountain_car.png
            report.md
