environment:
  grid_rows: 8
  grid_cols: 8
  max_carry: 2
  min_cargos: 1
  max_cargos: 3
  max_steps: 100
  enable_opponent: false
  enable_obstacles: false

rewards:
  step_penalty: -0.02
  collision_penalty: -2.0
  terminate_on_collision: false
  pickup_reward: 2.0
  delivery_base: 5.0
  delivery_combo: 2.0
  shaping_factor: 0.1 # Increased slightly to guide navigation
  efficiency_bonus: 2.0 # Higher bonus

training:
  episodes: 100000
  learning_rate: 3e-4 # Standard stable PPO rate
  n_steps: 2048
  batch_size: 64 # Increased for stability
  n_epochs: 10
  gamma: 0.99
  ent_coef: 0.01 # Reduced to allow convergence
  clip_range: 0.2
  network_arch: [128, 128, 128] # Network Architecture (Hidden Layers)

paths:
  model_save_path: "src/part3/ppo_warehouse"
